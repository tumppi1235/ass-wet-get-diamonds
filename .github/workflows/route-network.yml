name: Offline route network
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public map reader
        run: python -m pip install osmium==4.3.2
      - name: Access, topology and actual OSM reader regressions
        run: |
          mkdir -p test-results
          python tools/test_route_network.py 2>&1 | tee test-results/route-network.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-route-tests
          path: test-results/route-network.txt
          retention-days: 30
