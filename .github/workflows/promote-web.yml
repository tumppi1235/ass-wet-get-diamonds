name: Promote tested web candidate
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main Web checks run ID (phone checks must be recorded first)
        required: true
      field_test_issue:
        description: GitHub issue URL containing the phone test result and any accepted limitations
        required: true
permissions:
  actions: read
  contents: write
  issues: read
concurrency:
  group: web-production-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify candidate came from successful main checks
        id: candidate
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.run_id }}
          FIELD_TEST_ISSUE: ${{ inputs.field_test_issue }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.RUN_ID)) throw new Error('Invalid run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(process.env.RUN_ID)});
            if(run.conclusion!=='success'||run.head_branch!=='main'||run.event==='pull_request'||run.path!=='.github/workflows/web-ci.yml'||run.head_repository.full_name!==`${context.repo.owner}/${context.repo.repo}`) throw new Error('Only a successful main candidate can be promoted');
            const prefix=`https://github.com/${context.repo.owner}/${context.repo.repo}/issues/`;
            if(!process.env.FIELD_TEST_ISSUE.startsWith(prefix)||!/^\d+$/.test(process.env.FIELD_TEST_ISSUE.slice(prefix.length))) throw new Error('Record phone results in a repository issue first');
            await github.rest.issues.get({...context.repo,issue_number:Number(process.env.FIELD_TEST_ISSUE.slice(prefix.length))});
            core.setOutput('sha',run.head_sha);
      - uses: actions/download-artifact@v4
        with:
          name: web-production
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify immutable candidate
        run: sha256sum -c web-production.sha256
      - name: Publish versioned candidate without rebuilding
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          RUN_ID: ${{ inputs.run_id }}
          FIELD_TEST_ISSUE: ${{ inputs.field_test_issue }}
        with:
          script: |
            const fs=require('fs');
            const release=await github.rest.repos.createRelease({...context.repo,tag_name:`web-tested-${process.env.RUN_ID}`,target_commitish:process.env.SOURCE_SHA,name:`Tested web candidate ${process.env.RUN_ID}`,prerelease:true,body:`Source: ${process.env.SOURCE_SHA}\nChecks: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}\nPhone evidence: ${process.env.FIELD_TEST_ISSUE}\n\nProduction candidate. Live Sites publication is a separate authorized step; see docs/DEPLOYMENT.md.`});
            for(const name of ['web-production.tar.gz','web-production.sha256']) await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.data.id,name,data:fs.readFileSync(name)});
